stages:
  - verify
  - deploy_staging
  - deploy_production

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        regexp: '\A(?!(?:docs/|prisma/migrations-archive/|\.agents/|\.vscode/|(?:\.gitignore|\.gitattributes|metadata\.json)\z|[^/]+\.md\z)).+'
    - when: never

docs_only:
  stage: verify
  image: alpine:3.20
  interruptible: true
  script:
    - echo "Documentation-only or metadata-only merge request; application verification and deployment are not needed."
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        regexp: '\A(?!(?:docs/|prisma/migrations-archive/|\.agents/|\.vscode/|(?:\.gitignore|\.gitattributes|metadata\.json)\z|[^/]+\.md\z)).+'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never

verify:
  stage: verify
  image: node:22-alpine
  interruptible: true
  variables:
    DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/aura_ci?schema=public
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
  before_script:
    - apk add --no-cache libc6-compat openssl
    - npm install --global pnpm@10.33.0
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
    - pnpm exec prisma generate
  script:
    - pnpm run lint
    - >-
      unit_test_files="$(find test -maxdepth 1 -name '*.test.ts'
      ! -name 'accountTypeInvariant.test.ts'
      ! -name 'auditLog.test.ts'
      ! -name 'databaseConstraints.test.ts'
      ! -name 'databaseTransactions.test.ts'
      ! -name 'financialRetention.test.ts'
      ! -name 'timezone.test.ts' -print)";
      test -n "$unit_test_files";
      node -r ./test/tsx-preload.cjs --import tsx --test $unit_test_files
    - pnpm run build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        regexp: '\A(?!(?:docs/|prisma/migrations-archive/|\.agents/|\.vscode/|(?:\.gitignore|\.gitattributes|metadata\.json)\z|[^/]+\.md\z)).+'
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        regexp: '\A(?!(?:docs/|prisma/migrations-archive/|\.agents/|\.vscode/|(?:\.gitignore|\.gitattributes|metadata\.json)\z|[^/]+\.md\z)).+'

.vm_deploy:
  tags:
    - aura-runner
  interruptible: false
  variables:
    GIT_DEPTH: "0"
  before_script:
    - test -n "$VM_DEPLOY_HOST"
    - test -n "$VM_DEPLOY_USER"
    - test -f "$VM_DEPLOY_SSH_KEY"
    - test -f "$VM_DEPLOY_KNOWN_HOSTS"
    - chmod 600 "$VM_DEPLOY_SSH_KEY"
  script:
    - >-
      set -euo pipefail;
      incoming="/data/aura-talent/incoming/${CI_COMMIT_SHA}-${CI_PIPELINE_ID}";
      git archive --format=tar "$CI_COMMIT_SHA" |
      ssh -i "$VM_DEPLOY_SSH_KEY" -o IdentitiesOnly=yes
      -o "UserKnownHostsFile=$VM_DEPLOY_KNOWN_HOSTS" -o StrictHostKeyChecking=yes -T
      "$VM_DEPLOY_USER@$VM_DEPLOY_HOST"
      "mkdir -p '$incoming' && tar -xf - -C '$incoming'";
      ssh -i "$VM_DEPLOY_SSH_KEY" -o IdentitiesOnly=yes
      -o "UserKnownHostsFile=$VM_DEPLOY_KNOWN_HOSTS" -o StrictHostKeyChecking=yes -T
      "$VM_DEPLOY_USER@$VM_DEPLOY_HOST"
      "bash '$incoming/scripts/deploy-vmportal-ci.sh' '$DEPLOY_TARGET' '$CI_COMMIT_SHA' '$CI_PIPELINE_ID'"

deploy_staging:
  extends: .vm_deploy
  stage: deploy_staging
  needs:
    - verify
  variables:
    DEPLOY_TARGET: staging
  environment:
    name: staging
    url: https://staging.aura.com
  resource_group: aura-staging
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        regexp: '\A(?!(?:docs/|prisma/migrations-archive/|\.agents/|\.vscode/|(?:\.gitignore|\.gitattributes|metadata\.json)\z|[^/]+\.md\z)).+'

deploy_production:
  extends: .vm_deploy
  stage: deploy_production
  needs:
    - verify
    - deploy_staging
  variables:
    DEPLOY_TARGET: production
  environment:
    name: production
    url: https://aura.com
  resource_group: aura-production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: false
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        regexp: '\A(?!(?:docs/|prisma/migrations-archive/|\.agents/|\.vscode/|(?:\.gitignore|\.gitattributes|metadata\.json)\z|[^/]+\.md\z)).+'
      when: manual
      allow_failure: false
