# Managed by Aura Talent GitLab CI/CD; do not edit on the VM.
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 25M;

    # Tối ưu hóa SSL Cache
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 1. Chuyển hướng toàn bộ traffic HTTP (Cổng 80) sang HTTPS (Cổng 443)
    server {
        listen 80;
        server_name aura.com www.aura.com staging.aura.com;

        # Permanent Redirect 301 to HTTPS
        return 301 https://$host$request_uri;
    }

    # 2. Secure HTTPS server block (Port 443) with SSL/TLS configuration
    server {
        listen 443 ssl;
        http2 on;
        server_name aura.com www.aura.com;

        # SSL certificate file path(mouted from /home/macld/aura-talent-management/certs)
        ssl_certificate     /etc/nginx/certs/aura.com.crt;
        ssl_certificate_key /etc/nginx/private/aura.com.key;

        # TLS security standards
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Serve image files/uploads directly via Nginx(I/O optimization)
        location /uploads/ {
            alias /app/uploads/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # Forward all application and API requests to the container app
        location / {
            proxy_pass http://app:3000;
            proxy_http_version 1.1;
            
            # Support socket connection(HMR / Realtime)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Forwarding HTTPS headers to backend recognition
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            
            proxy_cache_bypass $http_upgrade;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name staging.aura.com;

        ssl_certificate     /etc/nginx/certs/aura.com.crt;
        ssl_certificate_key /etc/nginx/private/aura.com.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            proxy_pass http://staging-app:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
